<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SW TV Admin</title>
    <link rel="icon" type="image/png" href="media/images/blue%20logo.png">
    <link rel="stylesheet" href="css/tvdisplay.css">
</head>

<body class="admin-body">
    <header class="admin-header">
        <div>
            <p class="display-kicker">SW Display Control</p>
            <h1>TV Dashboard</h1>
        </div>
        <a class="screen-link" href="tvdisplay.html" target="_blank" rel="noreferrer">Open TV view</a>
    </header>

    <main class="admin-shell">
        <section id="login-panel" class="admin-panel login-panel">
            <div>
                <p class="display-kicker">Admin</p>
                <h2>Sign in</h2>
                <p class="admin-muted">Use the current admin password to edit the display.</p>
            </div>
            <form id="login-form" class="admin-form">
                <label class="field">
                    <span>Password</span>
                    <input id="admin-password" type="password" autocomplete="current-password" required>
                </label>
                <button class="button button-primary" type="submit">Sign in</button>
                <p id="login-status" class="form-status" aria-live="polite"></p>
            </form>
        </section>

        <section id="editor-panel" class="admin-panel editor-panel hidden">
            <div class="editor-heading">
                <div>
                    <p class="display-kicker">Promotional Signage</p>
                    <h2>Media Dashboard</h2>
                </div>
                <button id="sign-out" class="button button-secondary" type="button">Sign out</button>
            </div>

            <section class="media-manager">
                <div class="manager-column">
                    <div class="section-heading">
                        <div>
                            <p class="display-kicker">Library</p>
                            <h3>Media Browser</h3>
                        </div>
                        <button id="refresh-media" class="button button-secondary" type="button">Refresh</button>
                    </div>

                    <form id="upload-form" class="asset-form">
                        <label class="field">
                            <span>Upload media</span>
                            <input id="upload-file" type="file" accept="image/*,video/*">
                        </label>
                        <label class="field">
                            <span>Upload title</span>
                            <input id="upload-title" type="text" maxlength="120">
                        </label>
                        <button class="button button-primary" type="submit">Upload</button>
                    </form>

                    <form id="link-form" class="asset-form">
                        <label class="field">
                            <span>Link title</span>
                            <input id="link-title" type="text" maxlength="120">
                        </label>
                        <label class="field">
                            <span>Media URL</span>
                            <input id="link-url" type="text" maxlength="900" placeholder="https://... or /SW/media/...">
                        </label>
                        <label class="field">
                            <span>Media type</span>
                            <select id="link-media-type">
                                <option value="image">Image</option>
                                <option value="video">Video</option>
                            </select>
                        </label>
                        <button class="button button-primary" type="submit">Add Link</button>
                    </form>

                    <p id="media-status" class="form-status" aria-live="polite"></p>
                    <div id="media-library" class="media-library"></div>
                </div>

                <div class="manager-column">
                    <div class="section-heading">
                        <div>
                            <p class="display-kicker">Loop</p>
                            <h3>Curated Playlist</h3>
                        </div>
                        <button id="clear-playlist" class="button button-secondary" type="button">Clear</button>
                    </div>
                    <div id="playlist-list" class="playlist-list"></div>
                </div>
            </section>

            <form id="display-form" class="display-form">
                <label class="field">
                    <span>Default slide seconds</span>
                    <input id="slide-duration-seconds" type="number" min="3" max="300" step="1">
                </label>
                <label class="field field-wide">
                    <span>Bottom text</span>
                    <input id="ticker" type="text" maxlength="280">
                </label>
                <div class="form-actions">
                    <button class="button button-primary" type="submit">Publish</button>
                    <button id="refresh-display" class="button button-secondary" type="button">Refresh</button>
                    <p id="save-status" class="form-status" aria-live="polite"></p>
                </div>
            </form>
        </section>
    </main>

    <script src="js/tvdisplay-config.js"></script>
    <script type="module" src="js/tvadmin.js"></script>
</body>

</html>
